<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Save The Date | Mansi & Vikas</title>

  <!-- Open Graph for sleek WhatsApp / Social Media Link Previews -->
  <meta property="og:title" content="Save The Date • Mansi & Vikas" />
  <meta property="og:description" content="January 30 & 31, 2027 | Nagda, Madhya Pradesh" />
  <meta property="og:type" content="website" />

  <!-- Google Fonts: Playfair Display + Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-primary: #e6c587;
      --gold-gradient: linear-gradient(135deg, #f7e1b5 0%, #d4a359 50%, #f3d498 100%);
      --glass-bg: rgba(20, 24, 33, 0.55);
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e2430 0%, #0d0f14 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      color: #fff;
    }

    /* Ambient Background Glow */
    body::before {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(212, 163, 89, 0.15) 0%, transparent 70%);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }

    /* Floating Audio Player */
    .music-btn {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 60;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .music-btn:active { transform: scale(0.88); }
    .music-icon { font-size: 1.25rem; }
    .rotating { animation: spin 4s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Main Luxury Card Frame */
    .card-container {
      position: relative;
      z-index: 10;
      width: 90vw;
      max-width: 380px;
      height: 84vh;
      max-height: 640px;
      border-radius: 32px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 30px 70px -10px rgba(0, 0, 0, 0.9),
                  0 0 0 1px rgba(255, 255, 255, 0.08);
      background: #14171f;
    }

    /* Revealed Underneath Card */
    .reveal-card {
      position: absolute;
      inset: 0;
      /* If you uploaded couple.jpg, change this url to: url('couple.jpg') */
      background: linear-gradient(180deg, rgba(13, 15, 20, 0.2) 0%, rgba(13, 15, 20, 0.75) 60%, rgba(13, 15, 20, 0.98) 100%),
                  url('couple.jpeg') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 32px 24px;
      text-align: center;
    }

    .badge {
      font-size: 0.72rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--gold-primary);
      margin-bottom: 12px;
      font-weight: 600;
      background: rgba(230, 197, 135, 0.12);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(230, 197, 135, 0.25);
      backdrop-filter: blur(8px);
    }

    .names-wrap {
      margin-bottom: 10px;
    }

    .names {
      font-family: 'Playfair Display', serif;
      font-size: 2.1rem;
      font-weight: 600;
      line-height: 1.25;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
    }

    .ampersand {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-style: italic;
      color: #f7e1b5;
      -webkit-text-fill-color: #f7e1b5;
      display: inline-block;
      margin: 2px 0;
    }

    .date-highlight {
      font-size: 1.18rem;
      font-weight: 500;
      color: #f3f4f6;
      margin-bottom: 6px;
      letter-spacing: 0.8px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }

    .location {
      font-size: 0.9rem;
      color: #b0b8c4;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 400;
      letter-spacing: 0.4px;
    }

    /* Cal Button */
    .cal-btn {
      background: var(--gold-gradient);
      color: #14130d;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 14px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px -3px rgba(212, 163, 89, 0.35);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .cal-btn:active { transform: scale(0.95); }

    /* Scratch Canvas Overlay */
    #scratchCanvas {
      position: absolute;
      inset: 0;
      touch-action: none;
      cursor: pointer;
      z-index: 20;
      transition: opacity 0.8s ease-out, filter 0.8s ease-out;
    }

    /* Smooth Dissolve Out */
    .dissolve {
      opacity: 0 !important;
      filter: blur(10px);
      pointer-events: none;
    }

    /* Luxury Floating Hint Badge */
    .hint-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 25;
      font-size: 0.85rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 600;
      color: #fff;
      background: var(--glass-bg);
      padding: 14px 24px;
      border-radius: 40px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      animation: gentlePulse 2.5s infinite ease-in-out;
      transition: opacity 0.4s ease;
    }

    @keyframes gentlePulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.95; }
      50% { transform: translate(-50%, -50%) scale(1.04); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Floating Audio Button -->
  <div class="music-btn" id="musicToggle" title="Play Music">
    <span class="music-icon" id="musicIcon">🎵</span>
  </div>

  <!-- Background Music -->
  <audio id="bgMusic" loop preload="auto">
    <source src="https://assets.mixkit.co/music/preview/mixkit-serene-view-443.mp3" type="audio/mp3">
  </audio>

  <div class="card-container">
    <!-- Revealed Content -->
    <div class="reveal-card">
      <div class="badge">Save The Date</div>
      <div class="names-wrap">
        <div class="names">Mansi Karandikar</div>
        <div class="ampersand">&amp;</div>
        <div class="names">Vikas Mishra</div>
      </div>
      <div class="date-highlight">January 30 &amp; 31, 2027</div>
      <div class="location">📍 Nagda, Madhya Pradesh</div>
      
      <!-- Calendar Sync Button -->
      <a 
        class="cal-btn" 
        href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Wedding:+Mansi+Karandikar+%26+Vikas+Mishra&dates=20270130/20270201&details=Save+the+Date+for+the+wedding+celebrations+of+Mansi+and+Vikas!&location=Nagda,+Madhya+Pradesh" 
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>🗓️</span> Add to Calendar
      </a>
    </div>

    <!-- Scratch Canvas -->
    <canvas id="scratchCanvas"></canvas>
    <div class="hint-text" id="hint">✨ Scratch to Reveal</div>
  </div>

  <script>
    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('hint');
    const container = canvas.parentElement;

    // Music Player Setup
    const musicBtn = document.getElementById('musicToggle');
    const musicIcon = document.getElementById('musicIcon');
    const bgMusic = document.getElementById('bgMusic');
    let isPlaying = false;

    musicBtn.addEventListener('click', () => {
      if (isPlaying) {
        bgMusic.pause();
        musicIcon.classList.remove('rotating');
        musicIcon.textContent = '🔈';
      } else {
        bgMusic.play().then(() => {
          musicIcon.classList.add('rotating');
          musicIcon.textContent = '🎶';
        }).catch(() => {});
      }
      isPlaying = !isPlaying;
    });

    function initCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;

      // Deep metallic graphite texture
      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, '#1a1e28');
      grad.addColorStop(0.5, '#2b3445');
      grad.addColorStop(1, '#141720');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Gold shimmer dust specks
      ctx.fillStyle = 'rgba(230, 197, 135, 0.22)';
      for (let i = 0; i < 75; i++) {
        ctx.beginPath();
        ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    let isDrawing = false;
    let strokeCount = 0;
    let isFullyRevealed = false;

    function revealFullCard() {
      if (isFullyRevealed) return;
      isFullyRevealed = true;
      hint.style.opacity = '0';
      canvas.classList.add('dissolve');

      setTimeout(() => {
        canvas.style.display = 'none';
        hint.style.display = 'none';
      }, 800);
    }

    function startScratch(e) {
      if (isFullyRevealed) return;
      isDrawing = true;
      strokeCount++;

      // Hide the initial instruction pill after touch starts
      hint.style.opacity = '0';

      // Auto-start soft music on interaction
      if (!isPlaying) {
        bgMusic.play().then(() => {
          isPlaying = true;
          musicIcon.classList.add('rotating');
          musicIcon.textContent = '🎶';
        }).catch(() => {});
      }

      scratch(e);

      // Automatically clear after 2-3 scratches
      if (strokeCount >= 3) {
        setTimeout(revealFullCard, 250);
      }
    }

    function scratch(e) {
      if (!isDrawing || isFullyRevealed) return;

      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      // Broad brush for generous removal
      ctx.arc(x, y, 46, 0, Math.PI * 2);
      ctx.fill();
    }

    function stopScratch() {
      isDrawing = false;
    }

    // Mouse Events
    canvas.addEventListener('mousedown', startScratch);
    window.addEventListener('mouseup', stopScratch);
    canvas.addEventListener('mousemove', scratch);

    // Touch Events
    canvas.addEventListener('touchstart', startScratch, { passive: true });
    window.addEventListener('touchend', stopScratch);
    canvas.addEventListener('touchmove', scratch, { passive: true });

    window.addEventListener('resize', initCanvas);
    initCanvas();
  </script>
</body>
</html>
