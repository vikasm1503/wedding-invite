<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Save The Date | Mansi & Vikas</title>
  
  <!-- Open Graph for sleek WhatsApp / Social Media Link Previews -->
  <meta property="og:title" content="Save The Date • Mansi & Vikas" />
  <meta property="og:description" content="January 30 & 31, 2027 | Nagda, Madhya Pradesh" />
  <meta property="og:type" content="website" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #0f1115;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    /* Music Toggle Button */
    .music-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 50;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 0.2s;
    }
    .music-btn:active { transform: scale(0.9); }
    .music-icon {
      font-size: 1.2rem;
      display: inline-block;
    }
    .rotating {
      animation: spin 3s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Main Card Frame */
    .card-container {
      position: relative;
      width: 90vw;
      max-width: 380px;
      height: 600px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85), 0 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    /* Revealed Underneath Card */
    .reveal-card {
      position: absolute;
      inset: 0;
      /* Replace the URL below with your high-res vertical photo */
      background: linear-gradient(180deg, rgba(15, 17, 21, 0.35) 0%, rgba(15, 17, 21, 0.95) 85%),
                  url('couple.jpeg') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 36px 20px;
      text-align: center;
    }
    .badge {
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #e5c07b;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .names {
      font-size: 2.1rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 10px;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(180deg, #ffffff 0%, #dcdcdc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .ampersand {
      font-size: 1.6rem;
      font-style: italic;
      color: #e5c07b;
      -webkit-text-fill-color: #e5c07b;
      margin: 0 4px;
    }
    .date-highlight {
      font-size: 1.25rem;
      font-weight: 500;
      color: #f3f4f6;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .location {
      font-size: 0.95rem;
      color: #9ca3af;
      margin-bottom: 26px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .cal-btn {
      background: linear-gradient(135deg, #f3d498 0%, #cfa054 100%);
      color: #1a150b;
      font-weight: 700;
      padding: 13px 26px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(229, 192, 123, 0.25);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .cal-btn:active {
      transform: scale(0.96);
    }

    /* Scratch Canvas Overlay */
    #scratchCanvas {
      position: absolute;
      inset: 0;
      touch-action: none;
      cursor: pointer;
      transition: opacity 0.7s ease-out;
    }
    .hint-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(0, 0, 0, 0.55);
      padding: 12px 20px;
      border-radius: 30px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: opacity 0.4s;
    }
  </style>
</head>
<body>

  <!-- Floating Audio Toggle -->
  <div class="music-btn" id="musicToggle" title="Play Music">
    <span class="music-icon" id="musicIcon">🎵</span>
  </div>

  <!-- Romantic Background Audio Track (Royalty-free placeholder) -->
  <audio id="bgMusic" loop preload="auto">
    <source src="https://assets.mixkit.co/music/preview/mixkit-serene-view-443.mp3" type="audio/mp3">
  </audio>

  <div class="card-container">
    <!-- Underneath Layer (Revealed) -->
    <div class="reveal-card">
      <div class="badge">Save The Date</div>
      <div class="names">
        Mansi Karandikar <br/>
        <span class="ampersand">&amp;</span> <br/>
        Vikas Mishra
      </div>
      <div class="date-highlight">January 30 &amp; 31, 2027</div>
      <div class="location">📍 Nagda, Madhya Pradesh</div>
      
      <!-- One-Click Google Calendar Event -->
      <a 
        class="cal-btn" 
        href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Wedding:+Mansi+Karandikar+%26+Vikas+Mishra&dates=20270130/20270201&details=Save+the+Date+for+the+wedding+celebrations+of+Mansi+and+Vikas!&location=Nagda,+Madhya+Pradesh" 
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>🗓️</span> Add to Calendar
      </a>
    </div>

    <!-- Scratchable Overlay Canvas -->
    <canvas id="scratchCanvas"></canvas>
    <div class="hint-text" id="hint">✨ Scratch to Reveal</div>
  </div>

  <script>
    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const hint = document.getElementById('hint');
    const container = canvas.parentElement;

    // Music Player Setup
    const musicBtn = document.getElementById('musicToggle');
    const musicIcon = document.getElementById('musicIcon');
    const bgMusic = document.getElementById('bgMusic');
    let isPlaying = false;

    musicBtn.addEventListener('click', () => {
      if (isPlaying) {
        bgMusic.pause();
        musicIcon.classList.remove('rotating');
        musicIcon.textContent = '🔈';
      } else {
        bgMusic.play().then(() => {
          musicIcon.classList.add('rotating');
          musicIcon.textContent = '🎶';
        }).catch(() => {});
      }
      isPlaying = !isPlaying;
    });

    function initCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;

      // Elegant deep metallic scratch surface
      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, '#1c202a');
      grad.addColorStop(0.5, '#2e3748');
      grad.addColorStop(1, '#181b22');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Metallic dust particles
      ctx.fillStyle = 'rgba(229, 192, 123, 0.18)';
      for (let i = 0; i < 60; i++) {
        ctx.beginPath();
        ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    let isDrawing = false;
    let scratched = false;
    let totalPixelsChecked = 0;

    function checkScratchPercentage() {
      // Sample pixels every 25 scratch strokes to save performance
      totalPixelsChecked++;
      if (totalPixelsChecked % 25 !== 0) return;

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let transparentPixels = 0;
      const step = 4 * 16; // Skip every 16th pixel for fast execution

      for (let i = 3; i < imgData.data.length; i += step) {
        if (imgData.data[i] === 0) transparentPixels++;
      }

      const totalChecked = imgData.data.length / step;
      // If ~40% scratched, smoothly dissolve the rest
      if (transparentPixels / totalChecked > 0.4) {
        canvas.style.opacity = '0';
        setTimeout(() => {
          canvas.style.display = 'none';
        }, 700);
      }
    }

    function scratch(e) {
      if (!isDrawing) return;

      if (!scratched) {
        hint.style.opacity = '0';
        scratched = true;
        // Optionally auto-start music on first touch interaction
        if (!isPlaying) {
          bgMusic.play().then(() => {
            isPlaying = true;
            musicIcon.classList.add('rotating');
            musicIcon.textContent = '🎶';
          }).catch(() => {});
        }
      }

      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, 36, 0, Math.PI * 2);
      ctx.fill();

      checkScratchPercentage();
    }

    canvas.addEventListener('mousedown', () => isDrawing = true);
    window.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mousemove', scratch);

    canvas.addEventListener('touchstart', (e) => {
      isDrawing = true;
      scratch(e);
    }, { passive: true });
    window.addEventListener('touchend', () => isDrawing = false);
    canvas.addEventListener('touchmove', scratch, { passive: true });

    window.addEventListener('resize', initCanvas);
    initCanvas();
  </script>
</body>
</html>
